name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.2.0'
        required: true
      commit:
        description: 'Commit built by each platform'
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.commit || github.ref }}
      - name: Check the release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="${{ github.event.inputs.version || github.ref_name }}"
          test "v$version" = "$tag" || {
            echo "release $tag does not match Cargo.toml v$version" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --locked

  package:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.commit || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          rm -rf dist
          mkdir -p dist/nshw/bin
          # The target, rather than the runner's marketing name, selects the suffix.
          if [[ "${{ matrix.target }}" = *-pc-windows-msvc ]]; then exe=nshw.exe; else exe=nshw; fi
          cp "target/${{ matrix.target }}/release/$exe" dist/nshw/bin/
          ./dist/nshw/bin/$exe toolchain version
          (cd dist && tar czf "../nshw-${{ matrix.name }}.tar.gz" nshw)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "nshw-${{ matrix.name }}.tar.gz" > "nshw-${{ matrix.name }}.tar.gz.sha256"
          else
            shasum -a 256 "nshw-${{ matrix.name }}.tar.gz" > "nshw-${{ matrix.name }}.tar.gz.sha256"
          fi
          cat "nshw-${{ matrix.name }}.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nshw-${{ matrix.name }}
          path: nshw-${{ matrix.name }}.tar.gz*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: package
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.commit || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nshw-*
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.event.inputs.commit || github.sha }}
          files: assets/*
          fail_on_unmatched_files: true
